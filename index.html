<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#fbf5e6">
<meta name="color-scheme" content="only light">
<title>다녀오겠습니다</title>
<meta name="description" content="낯선 길, 낯선 사람, 낯선 계산대. 그래도 한 걸음. 특수교육 대상 학생을 위한 동네 심부름 어드벤처.">
<link rel="preload" href="assets/fonts/HoonSaemaul.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23dc4646' d='M1 3h6v1H1zM2 2h4v1H2zM3 1h2v1H3z'/%3E%3Cpath fill='%23fce8c8' d='M2 4h4v3H2z'/%3E%3Cpath fill='%23a0643c' d='M3 5h2v2H3z'/%3E%3C/svg%3E">

<body>
<main id="game" aria-label="다녀오겠습니다 게임 화면">
  <canvas id="world" aria-label="동네 지도. 누른 곳으로 걸어가요."></canvas>
  <div id="hud" hidden>
    <div id="hud-left"></div>
    <div id="hud-right" aria-live="polite"></div>
  </div>
  <div id="goal" hidden aria-live="polite"></div>
  <button id="sound-btn" class="btn icon-only" aria-label="소리 설정" aria-expanded="false" aria-controls="sound-pop"></button>
  <div id="sound-pop" hidden role="dialog" aria-label="소리 설정">
    <label for="bgm-vol">배경음악</label>
    <div class="vol-row">
      <input id="bgm-vol" type="range" min="0" max="100" step="1">
      <output id="bgm-out" for="bgm-vol">60</output>
    </div>
  </div>
  <div id="dpad" aria-label="방향 버튼">
    <button class="up" data-k="u" aria-label="위로"><svg viewBox="0 0 7 7" aria-hidden="true"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM2 6h1v1h-1zM3 6h1v1h-1zM4 6h1v1h-1z"/></svg></button>
    <button class="left" data-k="l" aria-label="왼쪽으로"><svg viewBox="0 0 7 7" aria-hidden="true"><path d="M3 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM6 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM6 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM3 6h1v1h-1z"/></svg></button>
    <span class="hub" aria-hidden="true"></span>
    <button class="right" data-k="r" aria-label="오른쪽으로"><svg viewBox="0 0 7 7" aria-hidden="true"><path d="M3 0h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM0 2h1v1h-1zM1 2h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM5 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM0 4h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM3 6h1v1h-1z"/></svg></button>
    <button class="down" data-k="d" aria-label="아래로"><svg viewBox="0 0 7 7" aria-hidden="true"><path d="M2 0h1v1h-1zM3 0h1v1h-1zM4 0h1v1h-1zM2 1h1v1h-1zM3 1h1v1h-1zM4 1h1v1h-1zM2 2h1v1h-1zM3 2h1v1h-1zM4 2h1v1h-1zM0 3h1v1h-1zM1 3h1v1h-1zM2 3h1v1h-1zM3 3h1v1h-1zM4 3h1v1h-1zM5 3h1v1h-1zM6 3h1v1h-1zM1 4h1v1h-1zM2 4h1v1h-1zM3 4h1v1h-1zM4 4h1v1h-1zM5 4h1v1h-1zM2 5h1v1h-1zM3 5h1v1h-1zM4 5h1v1h-1zM3 6h1v1h-1z"/></svg></button>
  </div>
  <button id="memo-btn" class="btn icon-label" hidden>메모 보기</button>
  <div id="dialog" hidden role="dialog" aria-live="polite"></div>
  <section id="panel" class="panel" hidden></section>
  <div id="popup" hidden role="alertdialog"></div>
  <div id="toasts" aria-live="assertive"></div>
  <section id="screen" hidden></section>
  <div id="fade"></div>
</main>
<script type="module" src="js/game.js?v=202611261357"></script>
</body>
</html>
